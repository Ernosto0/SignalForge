# Dated wage / cost references for economic models (plan §8, §15 of the review table).
# Manually maintained. Every entry needs a source URL and an as_of date; never add an unsourced
# number. Read by the monetization agent (agent-modules §7) via MarketPack.economic(name).
#
# Units: "TRY/month", "TRY/USD", "hour/month". currency is null for non-money references.
# Role wages are NET monthly (what kariyer.net reports); monetization applies the loaded-cost
# multiplier. For reference, minimum wage employer cost / net = 40,214.03 / 28,075.50 ≈ 1.43.
#
# Role wages: one per role family seen in labor_spend signals (market-scan runs 7–21).
