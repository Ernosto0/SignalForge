# Caps, thresholds and provider settings. Every value here is overridable per run (from M1 on).
# Secrets and per-deployment choices (keys, model ids, cache mode) live in .env instead.

cache:
  # How long a cached entry is served in `live` mode. null = never expires.
  # `record` always refreshes; `replay` ignores TTLs (cache-only).
  ttl_days:
    search: 30
    page: 90
    llm: null

search:
  results_per_query: 10
  timeout_s: 30

fetch:
  user_agent: "SignalForge/0.1 (+evidence research bot; respects robots.txt)"
  timeout_s: 20
  max_bytes: 3000000
  # Minimum seconds between two requests to the same domain.
  per_domain_interval_s: 2.0
  # Extracted text shorter than this is treated as a JS-only / empty page.
  min_text_chars: 200

llm:
  timeout_s: 120
  # Retries on connection errors, timeouts, 429 and 5xx, with the SDK's backoff (0.5 s doubling,
  # capped at 8 s): 6 retries wait ~24 s, enough for a DNS or network blip. A call still failing
  # after that stops the stage (LLMUnavailable); finished calls are cached, so `--resume` is cheap.
  max_retries: 6
  max_output_tokens: 4000
  # USD per 1M tokens. Every model referenced by LLM_MODEL_* must be listed, or calls fail loudly
  # (an unknown price would make the budget cap meaningless).
  # cached_input: assumed 10% of input — verify against the provider's pricing page.
  pricing:
    gpt-6-luna:  { input: 0.10, cached_input: 0.01, output: 0.50 }
    gpt-6-sol:   { input: 2.00, cached_input: 0.20, output: 10.00 }
    gpt-6.1-sol: { input: 2.00, cached_input: 0.20, output: 10.00 }
    gpt-6-astra: { input: 10.00, cached_input: 1.00, output: 50.00 }

query_gen:
  # Hard cap on stored queries for a run (plan §4).
  max_queries: 150
  # Per-submarket quota split. The pack's regulatory seeds are added on top as market-wide queries
  # (and count toward max_queries). Job ads get a large share: their duty lists name the manual
  # work being paid for, which is the work an automation product replaces. Regulation is kept
  # small: in the first live run (2026-10-06) it yielded 46 of 123 signals, mostly rule text.
  intent_mix: { pain: 0.55, jobs: 0.35, regulatory: 0.10 }
  # Split of each submarket's pain quota across signal types, aimed at software-shaped problems
  # (2026-10-08). Vendor complaints were halved: "<vendor> şikayet" queries returned mostly service
  # failures (lost parcels, unanswered support) that no new software fixes. Workaround and wish
  # queries were raised, but not further: in ~40 SERP probes (2026-10-05) Excel/WhatsApp
  # workaround queries returned tutorials and templates (0/7) and wish queries vendor pages.
  # Re-tune from the market scan's per-type yield.
  pain_signal_mix:
    { complaint: 0.30, workaround: 0.25, wish: 0.20, tool_complaint: 0.15, price_signal: 0.10 }
  # Share of drafts the model is asked to restrict with `site:<registry domain>`; the rest search
  # the open web, where most long-tail Turkish B2B pain lives. Google silently ignores a `site:`
  # with no matching pages, so pain hints are kept rare.
  site_hint_share: { pain: 0.20, jobs: 0.70, regulatory: 0.30 }
  # Registry categories (sources.yaml) offered as source hints per intent. `reviews`
  # (play.google.com) is left out: app listing pages are indexed, individual reviews rarely are.
  source_categories:
    pain: [forum, complaints, social]
    jobs: [jobs]
    regulatory: [official, association]
  # Drafts requested = quota × overgenerate, so invalid / duplicate drafts don't leave gaps.
  overgenerate: 1.4
  min_words: 2
  max_words: 10
  # Google returns little for several exact phrases; extra quotes are removed.
  max_quoted_phrases: 1
  # rapidfuzz token_sort_ratio at or above which two queries (same source hint) are duplicates.
  near_dup_ratio: 90
  pack_seed_queries: true
  concurrency: 4
  # One call drafts ~35 queries for a submarket; reasoning tokens count toward this limit too.
  # At the global 4000 the fast model's output was cut off mid-JSON.
  max_output_tokens: 16000

# --- M2 collection: search → triage → fetch → dedupe (plan §4) ------------------------------

collect:
  # Search calls in flight (Serper's free plan allows 5/s). Results are cached, so reruns of
  # later stages cost no searches.
  search_concurrency: 4
  # Retries per query on provider errors/timeouts. Each attempt may cost a credit. SerpApi timed
  # out ~1 in 15 calls at 30 s; Serper had 0 failures in 192 calls (2026-10-07).
  search_retries: 2

triage:
  # URLs kept for fetching (plan §4). Candidates that pass the score bar beyond this cap are kept
  # as a ranked reserve: fetch draws from it when kept URLs fail, so dead links don't cost documents.
  max_urls: 200
  # One domain may fill at most this many of the kept slots (independence; job boards dominate).
  max_per_domain: 30
  # Minimum triage score (0–3, prompts/triage.md) by source tier: low tier needs a stronger signal.
  min_score: { high: 1, medium: 2, low: 2 }
  # Never worth a slot: video/social platforms we cannot fetch or quote.
  skip_domains: [youtube.com, instagram.com, facebook.com, tiktok.com, x.com, twitter.com,
                 pinterest.com, spotify.com, wikipedia.org]
  # The fetcher only extracts HTML (plan §10); documents are dropped before the model sees them.
  skip_extensions: [.pdf, .doc, .docx, .xls, .xlsx, .ppt, .pptx, .zip, .rar]
  batch_size: 25
  concurrency: 4
  max_output_tokens: 8000

fetch_stage:
  # Stop once this many documents exist (fetched + snippet-only), plan §4.
  max_documents: 200
  # Hard cap on page downloads per run, including failures and reserve backfill.
  max_attempts: 320
  concurrency: 8

dedupe:
  # Word shingles over Turkish-casefolded tokens.
  shingle_words: 5
  num_perm: 128
  # Estimated Jaccard similarity at or above which two documents are near-duplicates.
  near_dup_threshold: 0.8
  # Shorter texts produce too few shingles for a stable estimate; only exact text matches count.
  min_words: 40
  # Two documents quoting the same passage of at least this many words count as one source
  # (`same_quote`, extract stage): one complaint shown on several listing pages of a site.
  same_quote_min_words: 8

# --- M3 signals & problem landscape: extract → cluster → shortlist (plan §4, §7, §8.1) -------

extract:
  # Page text is split into chunks of about this many characters (cut at a paragraph or sentence
  # boundary); one fast-model call per chunk. Pages longer than the chunks allowed are truncated.
  chunk_chars: 8000
  chunk_overlap_chars: 300
  max_chunks_per_doc: 3
  max_signals_per_chunk: 8
  # Verified quotes outside these bounds are dropped (too short to be evidence / not an excerpt).
  min_quote_chars: 20
  max_quote_chars: 500
  # rapidfuzz partial ratio for a quote that is not an exact match after normalisation (plan §7.1).
  fuzzy_min_ratio: 95
  concurrency: 4
  max_output_tokens: 8000

cluster:
  max_clusters: 25
  # More signals than this are clustered in chunks, then the chunk clusters are merged.
  max_signals_per_call: 400
  # Also run the merge prompt when the run fits one call: a second look that joins clusters of
  # the same business + workflow. Run #6 (181 signals, one call) split one fleet-tracking problem
  # into 6 clusters even with the prompt rule.
  merge_pass: true
  # Smaller clusters go to noise: one signal is not a problem pattern.
  min_cluster_size: 2
  # A lone regulatory signal (one obligation, one official source) may form its own cluster.
  keep_regulatory_singletons: true
  max_output_tokens: 16000

# Evidence strength, 0–10 (plan §8.1). Deterministic; feeds Gate 1 and later Confidence.
strength:
  weights: { sources: 0.35, diversity: 0.15, quality: 0.20, recency: 0.10, directness: 0.20 }
  # Independent sources at which the source component saturates (log-scaled).
  source_saturation: 10
  # Distinct source categories (unlisted domains count as one) at which diversity saturates.
  diversity_saturation: 4
  tier_weights: { high: 1.0, medium: 0.6, low: 0.2 }
  snippet_only_factor: 0.5
  recency_months: 24
  # Recency credit for a source without a publication date.
  unknown_date: 0.5

# When a signal counts as software-fit (evidence/fit.py): something a small team's AI automation
# or workflow web app could address. The extract prompt states the facts; this rule decides, so it
# can be re-tuned without re-extracting. Real pain caused by a third party (a carrier losing a
# parcel) or by hardware does not fit.
software_fit:
  require_recurring: true
  data_kinds: [documents, messages, spreadsheets, forms, system_data]
  causes: [own_process, tool, regulation]

# Gate 1 (plan §4). min_strength is provisional: calibrate on the first labelled runs.
shortlist:
  min_strength: 4.0
  min_independent_sources: 3
  # A shortlisted problem also needs this many independent sources with a software-fit signal:
  # strong evidence of a problem software can't touch is not an opportunity for us.
  min_software_fit_sources: 2
  max_shortlisted: 10

# --- M4 verification & competitors: verify → competitors (plan §4, §7) -----------------------

# Second-round search per shortlisted problem: a bounded loop over our own cached search and
# fetch (agents/loop.py), then entailment of the key claims and a Gate-1 re-check.
verify:
  max_steps: 12
  max_searches: 15            # plan §4: ≤15 queries per problem
  max_fetches: 10
  max_observation_chars: 30000
  page_preview_chars: 1500
  max_rejections_in_row: 2
  concurrency: 3
  max_output_tokens: 3000
  source_categories: [forum, complaints, jobs, social, association]
  official_categories: [official]
  top_signals: 8
  key_claims_per_problem: 5
  min_key_claims_supported: 2

# Cheap-model check that a fact's excerpts really state it (plan §7.2).
entailment:
  batch_size: 10
  max_quotes_per_claim: 3
  max_output_tokens: 4000

competitors:
  max_competitors: 5          # plan §4
  model_seed_names: 5
  max_steps: 20
  max_searches: 12
  max_fetches: 20
  max_observation_chars: 30000
  page_preview_chars: 1500
  max_rejections_in_row: 2
  concurrency: 3
  max_output_tokens: 3000
  source_categories: [complaints, reviews, forum]
  always_dimensions: [price_for_smb, turkish_localization, e_document_integration, setup_effort]
  # The loop rarely reaches pricing or integration pages (its `site:` hints only cover registry
  # domains). After it, each confirmed product's own site is searched once per fixed dimension
  # (terms: market pack competitor_probes.yaml), price first for every product, then the next
  # dimension; at most this many searches per problem, on top of max_searches.
  probe_max_searches: 8
  probe_reads: 1
  # A product whose own site is in the market's language gets this cell from that page.
  localization_dimension: turkish_localization
  max_signal_dimensions: 6
  max_facts_per_page: 12
  fact_chars: 12000
  entail_cells: true
  seed_output_tokens: 2000
  matrix_output_tokens: 8000

# --- M5 commercial: buyers → monetization → score (plan §4, §6) -----------------------------

# Who buys: 1–3 opportunities per shortlisted problem, each with buyer roles citing the claim
# table (signal facts, the problem's inference, gap inferences, competitor segment facts, the
# plan's buyer hypotheses) or labelled as hypotheses. Market breadth search is not built yet.
buyers:
  max_opportunities_per_problem: 3
  # Signal facts in one problem's claim table (job ads first, then first-hand signals).
  max_claims_per_problem: 60
  # Segments of one problem this similar (Turkish-aware token_sort_ratio) are one segment.
  segment_dup_ratio: 85
  concurrency: 4
  max_output_tokens: 6000
  # Check that the facts a role cites state that role (entailment prompt, fast tier); a role
  # whose facts fail becomes a hypothesis. Batch size and token cap come from `entailment`.
  entail_roles: true
  role_quotes: 6               # quotes per role sent to the check (from its cited facts)

# What solving the problem is worth to one customer per month, as a range over dated assumption
# claims (plan §2 #15); code computes every number (scoring/economics.py). Gate 2 knocks out
# opportunities with no budget owner or whose price ceiling is below the founder's minimum.
monetization:
  # Share of the monthly value a product can charge (price ceiling = value × share).
  capture_share: { low: 0.10, high: 0.30 }
  # Net wage → employer cost. low: 2026 TR minimum wage employer cost / net (40,214.03 /
  # 28,075.50, market_packs/tr/economics.yaml); high: provisional (income tax brackets raise the
  # ratio above minimum wage). Re-check per market pack.
  loaded_cost_multiplier: { low: 1.43, high: 1.65 }
  # Signal facts in one opportunity's claim table (job ads and price signals first).
  max_claims_per_opportunity: 60
  concurrency: 4
  max_output_tokens: 4000

# ScoreCards (plan §8): attractiveness from 7 factors on an anchored rubric (scoring/rubric.yaml),
# confidence, founder fit, a rule-based category and the cheapest validation experiment
# (scoring/experiments.yaml). Every threshold here is provisional: tune in M7. Evidence strength
# weights are the `strength` block above.
score:
  weights: { severity: 20, economic_impact: 20, frequency: 10, competition_gap: 15,
             willingness_to_pay: 15, customer_accessibility: 10, market_breadth: 10 }
  # A factor whose citations include no fact is capped here and flagged (plan §8.2).
  uncited_cap: 2
  # competition_gap when the opportunity targets no gap inference.
  no_gap_cap: 2
  # Market breadth is not searched yet (buyers stores `status: not_searched`): a fixed level.
  market_breadth_unsearched_level: 2
  # WTP is at least `level` when this many distinct competitors show a price that converts to
  # USD/month and whose price fact has not failed entailment (price rows are not counted).
  wtp_floor: { min_competitors: 2, level: 3 }
  # economic_impact: midpoint of value_usd_month; level = 1 + boundaries ≤ midpoint.
  economic_impact_levels_usd_month: [25, 75, 200, 500]
  k_judges: 3                  # rubric judgments for the top `k_judge_top_n` (median per factor)
  k_judge_top_n: 5
  confidence:
    high: { min_strength: 7, max_hypothesis_share: 0.25, max_spread: 1 }
    low:  { min_strength: 5, max_hypothesis_share: 0.5,  max_spread: 2 }
  categories:
    strong: { min_attractiveness: 75, min_strength: 7, min_gap: 3 }
    competitive: { max_gap: 2, min_wtp: 4 }
    weak: { max_severity: 2 }
    # Counted signal facts with entailment supported or partial.
    false_positive: { min_supported_facts: 3 }
  # How uncertain a cited claim is, for the validation experiment (importance × uncertainty).
  uncertainty: { hypothesis: 1.0, assumption_unsourced: 0.9, assumption_sourced: 0.5,
                 inference: 0.4, fact_partial: 0.3, fact_unchecked: 0.3, fact_supported: 0.1 }
  # Sales motions a small founding team can't run in the MVP window → founder fit `stretch`.
  stretch_sales_motions: [field_sales, enterprise]
  # Entailment-check every fact in the claim tables first; failed facts leave the table.
  entail_cited: true
  max_claims_per_opportunity: 60
  concurrency: 4
  max_output_tokens: 4000

# Final report (plan §7.4; agent-modules.md §9): one LLM call per opportunity section, validated by
# reporting/validator.py. A bullet citing a hypothesis or unsourced assumption must contain a hedge.
report:
  full_reports: 5
  min_full_reports: 3          # fewer only if fewer opportunities are strong / interesting / competitive
  max_regenerations: 2
  hedges: [may, might, likely, hypothesis, unverified, "we assume", "not yet confirmed",
           plausible, probably, estimated, assumed]
  out_dir: reports
  max_output_tokens: 8000
  max_claims_per_section: 12
  max_bullets_per_section: 6
  excerpt_max_chars: 500
  concurrency: 4
